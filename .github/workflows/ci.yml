name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Check formatting
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "find src test -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror"

      # install.sh has no test harness; at least lock its POSIX-sh syntax in.
      - name: Check install.sh syntax
        run: sh -n install.sh

      # test/translation-probes/README.md is the index of the probe directory.
      # This fails when a probe file has no row, so a new probe cannot land
      # undocumented. Pure shell, so it needs no build.
      - name: Check translation-probe index
        run: tools/check_probe_index.sh

      # docs/README.md defines the document tiers. This fails when a document
      # is outside a tier, carries a status that disagrees with its directory,
      # or refers to a markdown file that does not exist. Pure Python, so it
      # needs no build.
      - name: Check document placement
        run: tools/check_docs_placement.py

      # The countable sets of the concurrency model in spec/. Each script
      # fails when its table loses a row or disagrees with the rule
      # sentences the spec states for it. Pure Python, so it needs no build.
      - name: Check concurrency spec tables
        run: |
          tools/check_sendable_table.py
          tools/check_worker_error_kinds.py
          tools/check_suspend_points.py
          tools/check_blocking_calls.py

      # Lox++ has no import, so the credit channel library of
      # examples/credit_channel.lox is also in each probe that tests it. This
      # fails when a copy differs from the example. Pure Python, so it needs
      # no build.
      - name: Check credit channel copies
        run: tools/check_credit_channel_copies.py

  pi-extensions:
    name: pi extension (subagent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The subagent extension builds kitty argv and tails the child's event
      # files. Its unit tests use a fake `kitten`, so they need no terminal.
      # The live kitty test stays out of CI: it needs a graphical kitty.
      - name: Run extension unit tests
        run: node --test .pi/extensions/subagent/*.test.ts

  pi-modes:
    name: pi mode guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The turn-policy test runs TypeScript directly, which needs the type
      # stripping that node 22.18 and later enable by default.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pinned: a new pi release can change the extension API. Bump this with
      # the extension, not on its own.
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      # Each guard of the autonomous-mode policy has a unit test, so a broken
      # guard fails by name. Pure node, so it needs no build.
      - name: Unit-test the turn policy
        run: node --test .pi/extensions/lib/mode-policy.test.ts

      # A real `pi --mode rpc` session with a scripted model: it proves the
      # guards fire in the extension, not only in the policy module.
      - name: Run the scripted mode sessions
        run: node tools/test_pi_modes.mjs

  tree-sitter:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev-editors image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-editors
          tags: loxpp-dev-editors:latest
          # Read the dev scope too so the base layers the C++-only jobs
          # already built are reused instead of rebuilt.
          cache-from: |
            type=gha,scope=dev-editors
            type=gha,scope=dev
          cache-to: type=gha,mode=min,scope=dev-editors

      - name: Generate, test, and parse the corpus
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/editors/tree-sitter-loxpp \
            loxpp-dev-editors:latest \
            bash -c '
              set -e
              tree-sitter generate
              tree-sitter test
              # Probes 141 and 142 hold an arm that the grammar rejects on
              # purpose (the comma chain, and a constructor pattern with no
              # enum name), so they are not in the parse. A spec probe that
              # the grammar does not parse yet is listed in
              # tools/spec-probe-xfail/tree-sitter.txt, and it is left out
              # too. A listed name that is not a probe file fails the step.
              notyet=$(grep -v "^#" ../../tools/spec-probe-xfail/tree-sitter.txt | awk "NF {print \$1}" | tr "\n" " ")
              for name in $notyet; do
                if [ ! -f ../../test/translation-probes/$name ]; then
                  echo "FAIL: tree-sitter.txt lists $name, which is not a probe"
                  exit 1
                fi
              done
              files=""
              for f in ../../examples/*.lox ../../bootstrap/*.lox ../../test/translation-probes/*.lox; do
                case "$f" in
                  *141_match_comma_chain_rejected*|*142_bare_positional_pattern_rejected*) continue ;;
                esac
                case " $notyet " in
                  *" $(basename "$f") "*) continue ;;
                esac
                files="$files $f"
              done
              n=$(echo $files | wc -w)
              echo "Parsing $n corpus files ..."
              set +e
              out=$(tree-sitter parse --quiet $files 2>&1)
              rc=$?
              set -e
              echo "$out"
              if [ $rc -ne 0 ] || printf "%s" "$out" | grep -qE "\((ERROR|MISSING)|MISSING \""; then
                echo "FAIL: corpus parse produced ERROR or MISSING nodes"
                exit 1
              fi
              echo "OK: $n files parsed, zero ERROR and zero MISSING nodes"
            '

  loxpp-lsp:
    name: loxpp-lsp language server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-debug-${{ github.sha }}
          restore-keys: |
            ccache-debug-

      # The debug preset builds loxpp-lsp under ASan + UBSan, so the smoke
      # test also checks for leaks and undefined behaviour in one run.
      - name: Build loxpp-lsp
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev:latest \
            bash -c "cmake --preset debug -DLOXPP_LSP=ON && cmake --build build --target loxpp-lsp"

      - name: Run the LSP smoke test
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c '
              set -e
              python3 tools/lsp_smoke.py build/loxpp-lsp
              # The diagnostics check must be able to fail: point it at a file
              # with the syntax error removed and expect a non-zero exit.
              printf "print 1;\n" > /tmp/ok.lox
              if python3 tools/lsp_smoke.py build/loxpp-lsp --bad-file /tmp/ok.lox; then
                echo "FAIL: smoke test passed on a file with no diagnostic"
                exit 1
              fi
              echo "OK: the diagnostics assertion fails when the error is removed"
            '

  neovim-plugin:
    name: Neovim plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # dev-editors carries Node + tree-sitter-cli plus Neovim and the two
      # optional plugin deps. It is FROM dev, so the C++ toolchain is present
      # to build loxpp and loxpp-lsp in the same image.
      - name: Build dev-editors image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-editors
          tags: loxpp-dev-editors:latest
          cache-from: |
            type=gha,scope=dev-editors
            type=gha,scope=dev
          cache-to: type=gha,mode=min,scope=dev-editors

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-nvim-plugin-${{ github.sha }}
          restore-keys: |
            ccache-nvim-plugin-
            ccache-debug-

      - name: Build binaries, parser, and run the headless smoke test
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            -e LOXPP_NVIM_PLUGINS=/opt/nvim-plugins \
            loxpp-dev-editors:latest \
            bash -c '
              set -e
              # The plugin ships its own copy of the tree-sitter queries under
              # queries/loxpp/; keep them identical to the grammar source.
              for q in highlights locals folds indents; do
                diff -u "editors/tree-sitter-loxpp/queries/$q.scm" \
                        "editors/loxpp.nvim/queries/loxpp/$q.scm" \
                  || { echo "FAIL: editors/loxpp.nvim/queries/loxpp/$q.scm drifted from the grammar"; exit 1; }
              done
              cmake --preset debug -DLOXPP_LSP=ON
              cmake --build build --target loxpp loxpp-lsp
              export PATH="/workspace/build:$PATH"
              ( cd editors/tree-sitter-loxpp && tree-sitter generate )
              editors/loxpp.nvim/scripts/build-parser.sh
              nvim --headless \
                --cmd "set rtp+=editors/loxpp.nvim" \
                --cmd "set rtp+=$LOXPP_NVIM_PLUGINS/nvim-treesitter" \
                --cmd "set rtp+=$LOXPP_NVIM_PLUGINS/nvim-lint" \
                "+checkhealth loxpp" -c "w! /tmp/health.txt" -c "qa!"
              cat /tmp/health.txt
              if grep -q "No healthcheck found" /tmp/health.txt; then
                echo "FAIL: :checkhealth loxpp did not find the health module"
                exit 1
              fi
              grep -q "loxpp-lsp .* on PATH" /tmp/health.txt \
                || { echo "FAIL: checkhealth did not see loxpp-lsp"; exit 1; }
              grep -q "parser .loxpp. is compiled" /tmp/health.txt \
                || { echo "FAIL: checkhealth did not see the compiled parser"; exit 1; }
              tools/check_nvim_plugin.sh
              tools/check_nvim_plugin.sh --fallback
              # Prove the LSP-attach check can fail: a server that exits at once.
              printf "#!/bin/sh\nexit 1\n" > /tmp/loxpp-lsp && chmod +x /tmp/loxpp-lsp
              if PATH="/tmp:$PATH" tools/check_nvim_plugin.sh; then
                echo "FAIL: the headless test passed with a broken loxpp-lsp"
                exit 1
              fi
              echo "OK: the LSP-attach assertion fails when the server is broken"
            '

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev-editors image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-editors
          tags: loxpp-dev-editors:latest
          cache-from: |
            type=gha,scope=dev-editors
            type=gha,scope=dev
          cache-to: type=gha,mode=min,scope=dev-editors

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-vscode-extension-${{ github.sha }}
          restore-keys: |
            ccache-vscode-extension-
            ccache-release-

      - name: Build loxpp-lsp
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev-editors:latest \
            bash -c "cmake --preset release -DLOXPP_LSP=ON && cmake --build build --target loxpp-lsp"

      - name: Check, test, and package the extension
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LOXPP_LSP_PATH=/workspace/build/loxpp-lsp \
            loxpp-dev-editors:latest \
            bash -c '
              set -e
              # The TextMate bundle ships a copy of the VS Code grammar;
              # fail when the two drift or a keyword leaves the grammar.
              python3 tools/check_textmate_grammar.py
              npm ci --prefix editors/loxpp-vscode
              npm run lint --prefix editors/loxpp-vscode
              npm run typecheck --prefix editors/loxpp-vscode
              npm run test --prefix editors/loxpp-vscode
              npm run compile --prefix editors/loxpp-vscode
              xvfb-run -a npm run test:integration --prefix editors/loxpp-vscode
              npm run package --prefix editors/loxpp-vscode
            '

  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # Keyed on the commit SHA so re-runs of the same commit reuse one save;
      # the prefix restore-key picks up the newest cache from an earlier
      # commit. CCACHE_MAXSIZE below bounds each scope's footprint in the
      # 10 GB cache budget shared with the Docker layer caches.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-

      # The release leg builds only the interpreter binary. The debug leg
      # builds the whole GTest suite and the Test step below runs it under
      # sanitizers; that run is the test gate, so a second unsanitized run
      # in the release leg adds cost without new coverage.
      - name: Build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev:latest \
            bash -c "cmake --preset ${{ matrix.preset }} && cmake --build build${{ matrix.preset == 'release' && ' --target loxpp' || '' }}"

      - name: ccache stats
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            loxpp-dev:latest \
            ccache -s

      - name: Test
        if: matrix.preset == 'debug'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build --output-on-failure -j$(nproc)"

      # The debug leg runs the example corpus under GC stress
      # (collect-on-every-allocation). This kept the corpus covered for
      # rooting bugs back when the debug preset compiled the binary with
      # -DLOXPP_STRESS_GC on by default. That macro is now a runtime switch,
      # so the env variable carries the same coverage. The release leg never
      # had this and keeps its normal GC schedule.
      - name: Run example checks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.preset == 'debug' && '-e LOXPP_STRESS_GC=1 ' || '' }}\
            loxpp-dev:latest \
            bash -c "python3 tools/check_examples.py build/loxpp examples/"

      # The zlib example is pure Lox++, so the corpus above only checks its
      # self-assertions. This drives its file probes against Python's zlib in
      # both directions, so a real RFC 1950/1951 implementation is the oracle.
      # Release only: the debug preset's instruction trace is not the point here.
      - name: zlib example - differential vs Python zlib
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            python3 examples/zlib_tests/diff_zlib.py build/loxpp

      # Mission #523 node #525: the coroutine probe corpus. Node #526 landed
      # the `yield` primitive and node #527 landed for-in over a Coroutine, so
      # the corpus is green and this step is a normal gate. Release only: the
      # debug preset's instruction trace floods stdout (see AGENTS.md).
      - name: Check coroutine probes
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "tools/check_coroutine_probes.sh"

      # The spec probes of test/translation-probes/ (the files with a STATUS
      # line), against the stdout the spec defines. Inside a mission, a
      # consumer that does not pass a probe yet lists it in its expected-failure
      # file under tools/spec-probe-xfail/ (--xfail); the differential steps
      # read the native file as --oracle-xfail. Release only: the debug
      # preset's instruction trace floods stdout (see AGENTS.md).
      - name: Check spec probes - native
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "python3 tools/check_spec_probes.py build/loxpp test/translation-probes/ --xfail tools/spec-probe-xfail/native.txt"

      - name: Check spec probes - bootstrap interpreter
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/check_spec_probes.py bootstrap/lox_wrapper.sh test/translation-probes/ --consumer bootstrap --xfail tools/spec-probe-xfail/bootstrap.txt && python3 tools/check_spec_probes.py bootstrap/lox_wrapper.sh test/translation-probes/bootstrap-only/"

      - name: Run examples through loxpp bootstrap interpreter
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/check_examples.py bootstrap/lox_wrapper.sh examples/"

      # A wrapper that waits for its stdin forwarder never exits while the
      # caller keeps stdin open (issue #698). CI's own stdin is closed, so
      # only a check that holds a stdin pipe open finds the defect.
      - name: Check bootstrap wrapper exits with stdin open
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "python3 tools/check_bootstrap_stdin_exit.py bootstrap/lox_wrapper.sh"

      # spec/04-semantics.md, Workers and Tasks, Ending: lines that tasks on
      # different workers print never mix inside one line. The order of the
      # lines of two workers is not defined, so this check reads the lines in
      # any order (tools/check_print_lines.py). Release only, like the steps
      # above.
      - name: Check print lines of two workers - native
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "python3 tools/check_print_lines.py build/loxpp"

      - name: Check print lines of two workers - bootstrap interpreter
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/check_print_lines.py bootstrap/lox_wrapper.sh"

      # The differential gate for the bootstrap interpreter, both phases:
      # tools/diff_runtimes.py checks that a program native rejects is
      # rejected, and compares each run's stdout and exit outcome with
      # native. It never compares stderr (spec/README.md, Conformance).
      # check_spec_probes.py and check_examples.py above check each consumer
      # alone; this step compares it with native, which also covers an
      # example with no CHECK line. The probe walk takes only the spec
      # probes: other files of test/translation-probes/ pin translation
      # problems of the compiled backends.
      - name: Bootstrap differential suite - spec probes
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp bootstrap/lox_wrapper.sh test/translation-probes/ --only-spec-probes --consumer bootstrap --xfail tools/spec-probe-xfail/bootstrap.txt --oracle-xfail tools/spec-probe-xfail/native.txt --timeout 120"

      # Three probes that the walk above skips. Two have no STATUS line,
      # because a CHECK line cannot hold the NUL byte they print. The third is
      # in bootstrap-only/. Name them, so the bootstrap is compared with
      # native, byte for byte, on a NUL byte in a string literal, a NUL byte in
      # file content, and a last line with no newline.
      # The same step runs tools/check_cr_bytes.py on two printed carriage
      # returns: a lone one, and one directly before a newline.
      # diff_runtimes.py reads stdout in text mode, which turns each CR into a
      # newline, so that script compares the raw bytes (issue #656, issue #701).
      - name: Bootstrap differential suite - NUL probes
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp bootstrap/lox_wrapper.sh test/translation-probes/32_string_nul.lox test/translation-probes/56_file_nul.lox test/translation-probes/bootstrap-only/stdout_no_trailing_newline.lox --timeout 120 && python3 tools/check_cr_bytes.py build/loxpp bootstrap/lox_wrapper.sh"

      # examples/bench_jump_table.lox is left out by name: it is a
      # 5,000,000-iteration microbenchmark with no CHECK line, and it does
      # not finish inside the timeout on the bootstrap interpreter. The
      # QBE step that runs the corpus through the self-hosted interpreter
      # leaves it out for the same reason.
      - name: Bootstrap differential suite - examples
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c '
              files=$(find examples -maxdepth 1 -name "*.lox" ! -name "bench_jump_table.lox" | sort)
              python3 tools/diff_runtimes.py build/loxpp bootstrap/lox_wrapper.sh $files --timeout 120
            '

      # test/compile-errors/: one program per parser or resolver error.
      # --compile-errors fails a file that native does not reject at compile
      # time, so the corpus cannot turn into run-time programs unseen.
      - name: Bootstrap differential suite - compile errors
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp bootstrap/lox_wrapper.sh test/compile-errors/ --compile-errors"

      # Issue #323: the bootstrap interpreter borrows the native VM's own
      # call-frame budget (see docs/reference/bootstrap-stack-depth.md), so any
      # refactor that adds frames per evaluator cycle shrinks how deep a
      # target program may recurse before it overflows. This guards the
      # margin the example corpus needs: it must survive 256 extra native
      # frames. Release only, like the step above: the debug preset's
      # instruction trace floods the wrapper's stdout.
      - name: Run bootstrap headroom check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "tools/check_bootstrap_headroom.sh"

      # This ctest entry always skips itself on the debug leg (its own build
      # traces every instruction it runs -- see test/CMakeLists.txt), so this
      # is the one leg where it actually executes. --no-tests=error is load-
      # bearing: `ctest -R <name>` alone exits 0 when no test matches the
      # name, so a build where the test failed to register (for example,
      # python3 missing at configure time) would look identical to a build
      # where the test ran and passed.
      - name: Run bootstrap error-kind causes at run time
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapErrorKindCausesRuntime --output-on-failure --no-tests=error"

      # Same trace-noise constraint as BootstrapErrorKindCausesRuntime above,
      # so this is the one leg where BootstrapStackOverflow actually runs.
      - name: Run bootstrap stack-overflow catchability check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapStackOverflow --output-on-failure --no-tests=error"

      # BootstrapOperatorOverload and BootstrapMatchArmBreak are registered in test/CMakeLists.txt but
      # self-skip on debug (SKIP_RETURN_CODE 125), so they only run on the
      # release leg, where the trace macros are off. --no-tests=error fails
      # the step if a name stops being registered.
      - name: Run bootstrap operator-overload differential
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapOperatorOverload --output-on-failure --no-tests=error"

      - name: Run bootstrap match-arm-break check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapMatchArmBreak --output-on-failure --no-tests=error"

      # BootstrapMapIteration self-skips on debug (SKIP_RETURN_CODE 125), so
      # this release leg is the one place the entry runs. --no-tests=error
      # fails the step if the name stops being registered.
      - name: Run bootstrap Map-iteration check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapMapIteration --output-on-failure --no-tests=error"

      # BootstrapListMethodRead self-skips on debug (SKIP_RETURN_CODE 125), so
      # this release leg is the one place the entry runs. --no-tests=error
      # fails the step if the name stops being registered.
      - name: Run bootstrap List method read differential
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R BootstrapListMethodRead --output-on-failure --no-tests=error"

      # GcSweepLinear self-skips on debug (SKIP_RETURN_CODE 125), so the release
      # leg is the only place the sweep-time bound is checked.
      - name: Run GC sweep linearity check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R GcSweepLinear --output-on-failure --no-tests=error"

      # GcMinHeap self-skips on debug (SKIP_RETURN_CODE 125), so the release
      # leg is the only place the collection-count bound is checked.
      - name: Run GC minimum heap check
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build -R GcMinHeap --output-on-failure --no-tests=error"

      - name: Run Lox interpreter test suite (craftinginterpreters)
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "
              git clone --depth=1 https://github.com/munificent/craftinginterpreters /tmp/craftinginterpreters &&
              cd /tmp/craftinginterpreters/tool && dart pub get &&
              cd /tmp/craftinginterpreters &&
              dart tool/bin/test.dart jlox --interpreter /workspace/bootstrap/lox_wrapper.sh
            "

  codecrafters:
    name: Codecrafters challenge suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # release-preset key so this reuses build-and-test's release cache
      # instead of starting cold.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-codecrafters-${{ github.sha }}
          restore-keys: |
            ccache-codecrafters-
            ccache-release-

      # release, not debug: the debug preset's per-instruction trace would
      # flood the stdout every case here asserts exactly, same reason
      # build-and-test's bootstrap/differential steps use release.
      - name: Build loxpp
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp"

      - name: Build your own grep - transcribed stage suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            examples/codecrafters/build-your-own-grep/tests/run_stages.sh

      - name: Build your own grep - differential vs GNU grep -E
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            examples/codecrafters/build-your-own-grep/tests/diff_grep.sh

      # The fixtures are committed binaries (see the example's README); no
      # generation step here, since gen_fixtures.py's output is not
      # byte-stable across runs and running it would just dirty the tree.
      - name: Build your own SQLite - transcribed stage suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            examples/codecrafters/build-your-own-sqlite/tests/run_stages.sh

      - name: Build your own SQLite - differential vs Python sqlite3
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            python3 examples/codecrafters/build-your-own-sqlite/tests/diff_sqlite.py

      - name: Build your own HTTP server - transcribed stage suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            python3 examples/codecrafters/build-your-own-http-server/tests/run_stages.py

      - name: Build your own HTTP server - differential vs Python http.client/gzip
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            python3 examples/codecrafters/build-your-own-http-server/tests/diff_http.py

  managed-toolchains:
    name: Managed toolchains (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev-managed image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-managed
          tags: loxpp-dev-managed:latest
          # Also read the dev scope so this job reuses the base layers the
          # C++-only jobs already built instead of rebuilding them.
          cache-from: |
            type=gha,scope=dev-managed
            type=gha,scope=dev
          # mode=min, unlike the dev scope: this exports only the final image's
          # layers, not every intermediate step. Enough to keep the SourceForge
          # fetch out of later runs without spending much of the repo's 10 GB
          # cache budget, which is already ~65% used.
          cache-to: type=gha,mode=min,scope=dev-managed

      # Only the `Build loxpp` step below is routed through this; the JVM
      # runtime library is Java and ccache does not apply to it.
      # The release-preset compiles here match build-and-test's release job,
      # so fall back to that scope's key to seed a cold run.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-managed-release-${{ github.sha }}
          restore-keys: |
            ccache-managed-release-
            ccache-release-

      - name: Check managed toolchains
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/build_lox_rt.sh && tools/check_managed_toolchains.sh"

      # continue-on-error: this step's own tests are independent of every
      # later step (it rebuilds its own classes from source and produces
      # nothing any later step reads), but an unguarded failure here would
      # abort the whole job and silently skip the steps after it (see the
      # "Fail the job" step at the end, which is what actually turns a
      # failure here into a red job).
      - name: Build and test the JVM runtime library
        id: jvm_lox_rt_test
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/test_lox_rt.sh"

      - name: Build loxpp
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev-managed:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp"

      - name: ccache stats
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            loxpp-dev-managed:latest \
            ccache -s

      - name: Check JVM emission probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/check_jvm_probes.sh"

      # Mission #523 node #529: the coroutine corpus on the JVM backend. The
      # native gate for the same corpus is check_coroutine_probes.sh (the
      # unmanaged job); this step proves every probe's stdout is byte-identical
      # across native and the JVM backend.
      - name: JVM differential suite - coroutine probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh test/coroutine-probes/"

      # For every row of spec/04-semantics.md's Runtime Errors and Halting
      # Faults tables, checks native, the JVM, and the bootstrap interpreter
      # against spec/README.md, Conformance: a catchable fault is caught with
      # the same kind and type() everywhere; a halting fault halts, or is
      # caught. Messages are not compared.
      - name: Check fault table - differential
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_fault_table.py"

      # A missing JVM runtime jar must be a setup error, not a fault: the
      # wrapper exits without a marker, and the differential run above would
      # read that as a divergence. CI builds the jar earlier in this job, so
      # this negative run is the only place the guard itself is exercised.
      - name: Check fault table - missing JVM jar
        run: |
          set +e
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LOX_RT_JAR=/nonexistent/lox-rt.jar \
            loxpp-dev-managed:latest \
            python3 tools/check_fault_table.py > "$RUNNER_TEMP/fault_table_no_jar.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/fault_table_no_jar.txt"
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 for a missing JVM runtime jar, got $status"
            exit 1
          fi
          grep -q "no JVM runtime jar at /nonexistent/lox-rt.jar" "$RUNNER_TEMP/fault_table_no_jar.txt"

      # A consumer that cannot start must be a setup error too, not a fault.
      # The empty jar passes the missing-jar preflight (the file exists) and
      # fails only when the JVM wrapper tries to load a program, which is
      # exactly the startup check this step pins. A halting row would accept
      # that non-zero exit as a halt, so the assertions also require that the
      # tool stops before the table and prints no DIVERGE line.
      - name: Check fault table - unstartable consumer
        run: |
          set +e
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c ": > /tmp/broken-lox-rt.jar && LOX_RT_JAR=/tmp/broken-lox-rt.jar python3 tools/check_fault_table.py" \
            > "$RUNNER_TEMP/fault_table_unstartable.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/fault_table_unstartable.txt"
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 for an unstartable consumer, got $status"
            exit 1
          fi
          grep -q "consumer jvm cannot run a trivial program" "$RUNNER_TEMP/fault_table_unstartable.txt"
          if grep -q "DIVERGE" "$RUNNER_TEMP/fault_table_unstartable.txt"; then
            echo "the tool ran the table instead of stopping at the startup check"
            exit 1
          fi

          # A custom command owns its startup, the same rule as the missing-jar
          # preflight: a stand-in such as /bin/true must stay usable, so the
          # tool must report a row divergence, not a startup error.
          set +e
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            python3 tools/check_fault_table.py --jvm /bin/true --only arithmetic_type_error \
            > "$RUNNER_TEMP/fault_table_custom_jvm.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/fault_table_custom_jvm.txt"
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 for a custom --jvm command, got $status"
            exit 1
          fi
          grep -Fq "DIVERGE     arithmetic_type_error  [jvm]" "$RUNNER_TEMP/fault_table_custom_jvm.txt"

      # spec/05-stdlib.md: every File still open when the program ends must
      # be flushed as if close() had been called, on every exit path. Runs
      # on all four consumers this job already has a binary for.
      - name: Check file durability - native
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/check_file_durability.sh build/loxpp"

      - name: Check file durability - JVM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/check_file_durability.sh tools/loxpp_jvm.sh"

      # bootstrap/lox_wrapper.sh runs the self-hosted interpreter on the
      # native binary, so this needs no managed toolchain - it sits here
      # anyway, beside the other two, so a regression on any consumer of
      # this guarantee fails in one place. The bootstrap interpreter
      # defines exit() like every other consumer, so its p5b_exit_call
      # probe runs unskipped.
      - name: Check file durability - bootstrap interpreter
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c "tools/check_file_durability.sh bootstrap/lox_wrapper.sh"

      # The bootstrap interpreter defines the OS stdlib globals (issue
      # 263) by delegating to the host. This diffs the OS-access probe
      # between native and the bootstrap interpreter, with program
      # arguments, so those branches and the wrapper argument forwarding
      # cannot rot unnoticed. exit() is covered by the durability p5b
      # probe above instead: it ends the program and has no diffable
      # stdout past the call.
      - name: Check bootstrap OS stdlib globals match native
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              native_out=$(build/loxpp test/translation-probes/29_os_access.lox alpha beta)
              native_status=$?
              strap_out=$(bootstrap/lox_wrapper.sh test/translation-probes/29_os_access.lox alpha beta)
              strap_status=$?
              if [ "$native_status" -ne "$strap_status" ]; then
                echo "exit differs: native=$native_status bootstrap=$strap_status" >&2
                exit 1
              fi
              if [ -z "$strap_out" ]; then
                echo "bootstrap gave empty stdout; a silent failure would look like a match" >&2
                exit 1
              fi
              diff <(printf "%s\n" "$native_out") <(printf "%s\n" "$strap_out")
            '

      # The bootstrap interpreter's sockets and subprocess, added for issue
      # #516, delegate to the host. This diffs the net/process probe between
      # native and the bootstrap interpreter, with the same emptiness guard
      # the OS-stdlib step above uses.
      - name: Check bootstrap sockets and subprocess match native
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              native_out=$(build/loxpp test/translation-probes/64_net_process.lox)
              native_status=$?
              strap_out=$(bootstrap/lox_wrapper.sh test/translation-probes/64_net_process.lox)
              strap_status=$?
              if [ "$native_status" -ne "$strap_status" ]; then
                echo "exit differs: native=$native_status bootstrap=$strap_status" >&2
                exit 1
              fi
              if [ -z "$strap_out" ]; then
                echo "bootstrap gave empty stdout; a silent failure would look like a match" >&2
                exit 1
              fi
              diff <(printf "%s\n" "$native_out") <(printf "%s\n" "$strap_out")
            '

      # The parity gate. Every probe must be byte-identical on native and JVM
      # stdout (differential runner, not only the check_jvm_probes.sh diff
      # loop above). Also reads translation-probes/jvm-only/, which holds a
      # probe only the JVM backend can run today.
      - name: JVM differential suite - probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh test/translation-probes/ test/translation-probes/jvm-only/ --xfail tools/spec-probe-xfail/jvm.txt --oracle-xfail tools/spec-probe-xfail/native.txt"

      # The spec probes of test/translation-probes/ (the files with a
      # STATUS line) on the JVM backend, against the stdout the spec
      # defines.
      - name: Check spec probes - JVM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_spec_probes.py tools/loxpp_jvm.sh test/translation-probes/ --xfail tools/spec-probe-xfail/jvm.txt"

      # The compile phase of the differential gate: each parser or resolver
      # error of test/compile-errors/ must be rejected: a non-zero exit status
      # and empty stdout on the JVM backend, as on native. stderr is not compared.
      - name: JVM differential suite - compile errors
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh test/compile-errors/ --compile-errors"

      # spec/04-semantics.md, Workers and Tasks, Ending: print lines of two
      # workers never mix (see the native step in build-and-test).
      - name: Check print lines of two workers - JVM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_print_lines.py tools/loxpp_jvm.sh"

      # The full example corpus on the JVM backend, zero failures. --exclude
      # skips the map-iteration-order-sensitive examples
      # (tools/jvm_excluded_examples.txt); the native path below still runs
      # every example, unchanged.
      - name: JVM differential suite - examples
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_jvm.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # Permutation guard for the exclusion list itself. check_examples.py
      # SKIPs an excluded name; it never runs it, so it cannot tell a real
      # permutation from a content bug. This step runs diff_runtimes.py over
      # exactly the names in tools/jvm_excluded_examples.txt (read from the
      # file, so a new entry is covered with no CI edit) and fails the gate
      # if any one of them stops being a permutation of native stdout.
      - name: JVM differential suite - excluded examples stay permutations
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh --exclude tools/jvm_excluded_examples.txt --only-excluded examples/"

      # Full-corpus differential, every example. check_examples.py only
      # checks each example's own CHECK directives, so an example with none
      # (examples/bench_jump_table.lox, examples/remove.lox) could print a
      # wrong answer with CI green. This step compares full stdout for every
      # example instead.
      - name: JVM differential suite - full example corpus
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # The self-hosted interpreter compiles, assembles, and runs on the JVM
      # backend, and interprets a Lox++ program correctly. An emptiness guard
      # catches the case where both wrappers fail silently with empty stdout,
      # which a bare `diff <(a) <(b)` would report as a match.
      - name: JVM differential suite - self-hosted interpreter on the JVM backend
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              native_out=$(bootstrap/lox_wrapper.sh examples/fibonacci.lox)
              jvm_out=$(tools/loxpp_jvm_bootstrap.sh examples/fibonacci.lox)
              if [ -z "$native_out" ] || [ -z "$jvm_out" ]; then
                echo "one or both wrappers gave empty stdout; a silent failure would look like a match"
                exit 1
              fi
              diff <(printf "%s\n" "$native_out") <(printf "%s\n" "$jvm_out")
            '

      # Every example, run through the self-hosted interpreter, with the
      # interpreter itself running on the JVM backend. Zero failures, same
      # exclusion list as the examples step above.
      - name: JVM differential suite - examples through the self-hosted interpreter on the JVM backend
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_jvm_bootstrap.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # The same stdin-open check as the native wrapper's step in
      # build-and-test: the JVM twin has its own copy of the feeder.
      - name: JVM bootstrap wrapper exits with stdin open
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_bootstrap_stdin_exit.py tools/loxpp_jvm_bootstrap.sh"

      # The JVM bootstrap wrapper's own stdout filter, on the probes that the
      # spec walk cannot take: the two NUL probes have no STATUS line, and a
      # CHECK line cannot hold a NUL byte. The filter must keep every NUL byte
      # and an unterminated last line. diff_runtimes.py compares stdout byte
      # for byte and requires the exit statuses to be equal, so a wrapper that
      # crashes after it writes the right bytes still fails. The last check
      # makes a host failure non-zero; without it a failed host looks like a
      # clean run with empty output (issue #654).
      - name: JVM differential suite - bootstrap wrapper NUL and last-line probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              set -e
              python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm_bootstrap.sh \
                test/translation-probes/32_string_nul.lox \
                test/translation-probes/56_file_nul.lox \
                test/translation-probes/bootstrap-only/stdout_no_trailing_newline.lox \
                --timeout 300
              if LOXPP_BIN=/nonexistent tools/loxpp_jvm_bootstrap.sh \
                  test/translation-probes/32_string_nul.lox >/dev/null 2>&1; then
                echo "the JVM bootstrap wrapper exited 0 when its host failed" >&2
                exit 1
              fi
            '

      # The JVM lox-rt test step above is continue-on-error so its own
      # failure can't hide every step after it (see that step's comment).
      # This step is what still turns that failure into a red job.
      - name: Fail the job if the JVM runtime library's own tests failed
        if: steps.jvm_lox_rt_test.outcome == 'failure'
        run: |
          echo "The 'Build and test the JVM runtime library' step failed; see its log above." >&2
          exit 1

  qbe-toolchain:
    name: QBE toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev-qbe image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-qbe
          tags: loxpp-dev-qbe:latest
          # Also read the dev scope so this job reuses the base layers the
          # C++-only jobs already built instead of rebuilding them.
          cache-from: |
            type=gha,scope=dev-qbe
            type=gha,scope=dev
          cache-to: type=gha,mode=min,scope=dev-qbe

      - name: Check QBE toolchain
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "tools/check_qbe_toolchain.sh"

      # Builds libloxrt.a (the release preset: a debug build's sanitizer
      # flags would need their runtime linked into s2_hello too, which the
      # checkpoint's own plain `cc` link line does not do) and round-trips
      # this node's checkpoint through it.
      - name: Check libloxrt.a + startup (S2)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxrt -j\$(nproc) && tools/check_qbe_libloxrt.sh"

      # release preset again, same reason as S2's own step: native's stdout
      # must not carry LOXPP_DEBUG_PRINT_CODE's bytecode trace, or every
      # probe "diverges" from the QBE-compiled binary even when nothing is
      # wrong. Builds the native `loxpp` binary (the diff's other side) and
      # `qbe_emit_probe` (this node's own checkpoint driver) alongside
      # `loxrt`, then round-trips probes 01-05 and 15 through the real
      # toolchain.
      - name: Check straight-line code and jumps (S3)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_probe loxrt -j\$(nproc) && tools/check_qbe_s3_straight_line.sh"

      # Same release-preset reasoning as S3's own step. Builds `qbe_emit_program`
      # (this node's own checkpoint driver — a whole-program emitter, unlike
      # S3's single-function qbe_emit_probe, since CALL/CLOSURE make a real
      # program more than one function) and round-trips probes 06, 08, the
      # QBE-only V1/V3 adaptations, V2_shared, fib, and a deep-recursion probe
      # (Q3's own measured C-stack-depth test) through the real toolchain.
      - name: Check calls and closures (S4)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && tools/check_qbe_s4_calls_closures.sh"

      # Same release-preset reasoning as S3/S4's own steps. Round-trips
      # probes 09-14 and 16 (classes, super, for-in, lists/maps/index, enum
      # match, slice/in) through the real toolchain.
      - name: Check the rest of the language (S5)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && tools/check_qbe_s5_rest_of_language.sh"

      # Same release-preset reasoning as S3-S5's own steps. Round-trips the
      # status protocol, try/catch/throw/defer, and stack-overflow probes
      # through the real toolchain.
      - name: Check errors (S6)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && tools/check_qbe_s6_errors.sh"

      # S7's own checkpoint (issue #460): every probe in
      # test/translation-probes/ (the main directory, qbe-only/, and the
      # operator-overloading probe in jvm-only/) must be byte-identical to
      # native. Mission #523's test/coroutine-probes/ corpus is part of the
      # same gate now that QBE compiles YIELD natively (#530/#535).
      - name: Check QBE probes (S7)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && tools/check_qbe_probes.sh"

      # The spec probes of test/translation-probes/ (the files with a STATUS
      # line) on the QBE backend, against the stdout the spec defines.
      - name: Check spec probes - QBE
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && python3 tools/check_spec_probes.py tools/loxpp_qbe.sh test/translation-probes/ --xfail tools/spec-probe-xfail/qbe.txt"

      # The compile phase of the differential gate: each parser or resolver
      # error of test/compile-errors/ must be rejected: a non-zero exit status
      # and empty stdout on the QBE backend, as on native. stderr is not compared.
      - name: QBE differential suite - compile errors
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && python3 tools/diff_runtimes.py build/loxpp tools/loxpp_qbe.sh test/compile-errors/ --compile-errors"

      # spec/04-semantics.md, Workers and Tasks, Ending: print lines of two
      # workers never mix (see the native step in build-and-test).
      - name: Check print lines of two workers - QBE
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && python3 tools/check_print_lines.py tools/loxpp_qbe.sh"

      # S8's own checkpoint (issue #461): register promotion narrows what the
      # GC can see on the QBE backend's fused stack, so this runs the whole
      # probe corpus and the examples/ corpus under LOXPP_STRESS_GC=1, where
      # every allocation collects. A promoted local that a safe point failed
      # to spill is freed while still live and the run diverges.
      - name: Check register promotion under stress GC (S8)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && tools/check_qbe_s8_promotion.sh"

      # S7's own full-corpus checkpoint: every example under examples/
      # (non-recursive, matching the JVM CI step's own directory walk)
      # must be byte-identical between native and QBE. No exclusion file —
      # the QBE backend reuses native's own Table unchanged, so there is no
      # map-order permutation case to excuse (unlike the JVM).
      - name: QBE differential suite - full example corpus
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j\$(nproc) && python3 tools/diff_runtimes.py build/loxpp tools/loxpp_qbe.sh examples/"

      # The --target qbe front end (#503): compile to a standalone executable,
      # DELETE the source, and run the executable without it. Deleting the
      # source is the point: an implementation that reads the .lox at run time
      # by path passes a test that leaves the source in place. This also checks
      # that args() reflects the executable own command line, not the empty
      # list a harness that drops argc/argv would give.
      - name: --target qbe front end - standalone binary
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c '
              set -e
              cmake --preset release && cmake --build build --target loxpp loxrt -j$(nproc)
              src=$(mktemp -d)
              cp examples/fibonacci.lox "$src/prog.lox"
              build/loxpp --target qbe -o /tmp/standalone "$src/prog.lox"
              rm -rf "$src"
              native=$(build/loxpp examples/fibonacci.lox)
              moved=$(cd /tmp && ./standalone)
              if [ "$native" != "$moved" ]; then
                echo "standalone output differs from native" >&2
                exit 1
              fi
              printf "print args();" > /tmp/args.lox
              build/loxpp --target qbe -o /tmp/argbin /tmp/args.lox
              rm -f /tmp/args.lox
              got=$(/tmp/argbin alpha beta)
              if [ "$got" != "[alpha, beta]" ]; then
                echo "args() mismatch: expected [alpha, beta], got $got" >&2
                exit 1
              fi
              echo "OK: standalone binary embeds its source and exposes args()"
            '

      # S7's Q8 hazard (docs/decisions/qbe-backend.md: "measure QBE's time and memory
      # on bootstrap/loxpp_interpreter.lox early") — compiles the
      # self-hosted interpreter itself (3,700+ lines of Lox++, one very
      # large QBE function tree) with the QBE backend and runs the full
      # example corpus through it, comparing against
      # bootstrap/lox_wrapper.sh's own native-interpreted run.
      # examples/bench_jump_table.lox is left out by name, not routed
      # through an exclusion file: a 5,000,000-iteration microbenchmark
      # with no CHECK directives, interpreted twice over (native once for
      # the oracle, QBE once for the comparison), does not finish inside
      # this step's own timeout on either side — measured, not a QBE
      # defect.
      - name: QBE differential suite - full example corpus through the self-hosted interpreter
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-qbe:latest \
            bash -c '
              cmake --preset release && cmake --build build --target loxpp qbe_emit_program loxrt -j$(nproc)
              files=$(find examples -maxdepth 1 -name "*.lox" ! -name "bench_jump_table.lox" | sort)
              python3 tools/diff_runtimes.py bootstrap/lox_wrapper.sh tools/loxpp_qbe_bootstrap.sh $files --timeout 60
            '

      # The same stdin-open check as the native wrapper's step in
      # build-and-test: the QBE twin has its own copy of the feeder.
      - name: QBE bootstrap wrapper exits with stdin open
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-qbe:latest \
            bash -c '
              set -e
              cmake --preset release && cmake --build build --target loxpp loxrt -j$(nproc)
              python3 tools/check_bootstrap_stdin_exit.py tools/loxpp_qbe_bootstrap.sh
            '

      # The same wrapper-filter gate as the JVM job's step of that name, on
      # the QBE bootstrap wrapper: two NUL probes and a last line with no
      # newline, compared byte for byte with native. diff_runtimes.py also
      # requires the exit statuses to be equal. The last check makes a host
      # failure non-zero, so a failed host cannot look like a clean run with
      # empty output (issue #654).
      - name: QBE differential suite - bootstrap wrapper NUL and last-line probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-qbe:latest \
            bash -c '
              set -e
              cmake --preset release && cmake --build build --target loxpp loxrt -j$(nproc)
              python3 tools/diff_runtimes.py build/loxpp tools/loxpp_qbe_bootstrap.sh \
                test/translation-probes/32_string_nul.lox \
                test/translation-probes/56_file_nul.lox \
                test/translation-probes/bootstrap-only/stdout_no_trailing_newline.lox \
                --timeout 300
              if LOXPP_BIN=/nonexistent tools/loxpp_qbe_bootstrap.sh \
                  test/translation-probes/32_string_nul.lox >/dev/null 2>&1; then
                echo "the QBE bootstrap wrapper exited 0 when its host failed" >&2
                exit 1
              fi
            '

  release-static:
    name: Static musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build release-static image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: release-static
          tags: loxpp-release-static:latest
          cache-from: type=gha,scope=release-static
          cache-to: type=gha,mode=max,scope=release-static

      - name: Build release binaries
        run: |
          git config --global --add safe.directory '*'
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=1G \
            -e CCACHE_COMPRESS=1 \
            loxpp-release-static:latest \
            bash tools/build_release.sh

      - name: Assert loxpp is statically linked
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-release-static:latest \
            bash -c '
              set -e
              binary="dist/loxpp/loxpp"
              if [ ! -f "$binary" ]; then
                echo "ERROR: Binary not found at $binary"
                exit 1
              fi
              # Verify there are no NEEDED entries (a static binary has none).
              if readelf -d "$binary" | grep -q "NEEDED"; then
                echo "ERROR: Binary has dynamic dependencies (NEEDED entries)"
                readelf -d "$binary"
                exit 1
              fi
              # Verify there is no INTERP segment.
              if readelf -l "$binary" | grep -q "INTERP"; then
                echo "ERROR: Binary has an INTERP segment"
                readelf -l "$binary"
                exit 1
              fi
              echo "OK: loxpp is fully statically linked"
            '

      - name: Assert loxpp-lsp is statically linked
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-release-static:latest \
            bash -c '
              set -e
              binary="build/loxpp-lsp"
              if [ ! -f "$binary" ]; then
                echo "ERROR: Binary not found at $binary"
                exit 1
              fi
              # Verify there are no NEEDED entries (a static binary has none).
              if readelf -d "$binary" | grep -q "NEEDED"; then
                echo "ERROR: Binary has dynamic dependencies (NEEDED entries)"
                readelf -d "$binary"
                exit 1
              fi
              # Verify there is no INTERP segment.
              if readelf -l "$binary" | grep -q "INTERP"; then
                echo "ERROR: Binary has an INTERP segment"
                readelf -l "$binary"
                exit 1
              fi
              echo "OK: loxpp-lsp is fully statically linked"
            '

      - name: Verify examples pass
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-release-static:latest \
            python3 tools/check_examples.py dist/loxpp/loxpp examples/

      - name: Build the ghcr runtime image
        uses: docker/build-push-action@v5
        with:
          context: ./dist/loxpp
          file: ./packaging/runtime.Dockerfile
          load: true
          provenance: false
          tags: loxpp-runtime:test

      - name: Smoke-test the ghcr runtime image
        run: |
          set -euo pipefail
          BIN_VERSION="$(dist/loxpp/loxpp --version | sed -n '1p')"
          IMAGE_VERSION="$(docker run --rm loxpp-runtime:test --version | sed -n '1p')"
          if [ "$BIN_VERSION" != "$IMAGE_VERSION" ]; then
            echo "binary says '$BIN_VERSION', image says '$IMAGE_VERSION'" >&2
            exit 1
          fi
          echo "OK: runtime image reports $IMAGE_VERSION"
