name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Check formatting
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "find src test -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror"

  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # Keyed on the commit SHA so re-runs of the same commit reuse one save;
      # the prefix restore-key picks up the newest cache from an earlier
      # commit. CCACHE_MAXSIZE below bounds each scope's footprint in the
      # 10 GB cache budget shared with the Docker layer caches.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-

      - name: Build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev:latest \
            bash -c "cmake --preset ${{ matrix.preset }} && cmake --build build"

      - name: ccache stats
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            loxpp-dev:latest \
            ccache -s

      - name: Test
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "ctest --test-dir build --output-on-failure -j$(nproc)"

      - name: Run example checks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "python3 tools/check_examples.py build/loxpp examples/"

      - name: Run examples through loxpp bootstrap interpreter
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev:latest \
            bash -c "python3 tools/check_examples.py bootstrap/lox_wrapper.sh examples/"

      - name: Run Lox interpreter test suite (craftinginterpreters)
        if: matrix.preset == 'release'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "
              git clone --depth=1 https://github.com/munificent/craftinginterpreters /tmp/craftinginterpreters &&
              cd /tmp/craftinginterpreters/tool && dart pub get &&
              cd /tmp/craftinginterpreters &&
              dart tool/bin/test.dart jlox --interpreter /workspace/bootstrap/lox_wrapper.sh
            "

  variant-value:
    name: Value representation (std::variant smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev
          tags: loxpp-dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # The portable std::variant Value branch (src/value.h, LOXPP_NAN_TAGGING
      # off) is not covered by the debug/release matrix runs, which use the
      # NaN-boxed representation. Build only the interpreter binary here — not
      # the GTest suite — to keep the variant path compiled and behavior-checked
      # in CI at low cost. check_examples.py validates Value semantics
      # end-to-end against the example corpus.
      - name: Build loxpp with the std::variant Value
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "cmake --preset release-variant && cmake --build build --target loxpp"

      - name: Run example checks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev:latest \
            bash -c "python3 tools/check_examples.py build/loxpp examples/"

  managed-toolchains:
    name: Managed toolchains (JVM + CLR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev-managed image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          target: dev-managed
          tags: loxpp-dev-managed:latest
          # Also read the dev scope so this job reuses the base layers the
          # C++-only jobs already built instead of rebuilding them.
          cache-from: |
            type=gha,scope=dev-managed
            type=gha,scope=dev
          # mode=min, unlike the dev scope: this exports only the final image's
          # layers, not every intermediate step. Enough to keep the SourceForge
          # and nuget.org fetches out of later runs without spending much of the
          # repo's 10 GB cache budget, which is already ~65% used.
          cache-to: type=gha,mode=min,scope=dev-managed

      # Only the `Build loxpp` step below is routed through this; the JVM/CLR
      # runtime libraries are Java/C# and ccache does not apply to them.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-managed-release-${{ github.sha }}
          restore-keys: |
            ccache-managed-release-

      - name: Check managed toolchains
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/build_lox_rt.sh && tools/build_lox_rt_clr.sh && tools/check_managed_toolchains.sh"

      - name: Build and test the JVM runtime library
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/test_lox_rt.sh"

      - name: Build loxpp
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=400M \
            -e CCACHE_COMPRESS=1 \
            loxpp-dev-managed:latest \
            bash -c "cmake --preset release && cmake --build build --target loxpp"

      - name: ccache stats
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            loxpp-dev-managed:latest \
            ccache -s

      # Needs build/loxpp (built above, release preset): its own %g parity
      # test is differential against the native binary, not a fixed list.
      - name: Build and test the CLR runtime library
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/test_lox_rt_clr.sh"

      - name: Check JVM emission probes (N4/N5)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/check_jvm_probes.sh"

      # Needs build/loxpp (LOXPP_CLR_BACKEND, default ON; built above) and
      # runtime/clr/LoxRuntime.dll and runtime/clr/LoxHost.dll (both built
      # above by tools/build_lox_rt_clr.sh).
      - name: Check CLR emission probes
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "tools/check_clr_probes.sh"

      # Node N11, the parity gate. Checkpoint 1: every probe is
      # byte-identical on native and JVM stdout (differential runner, not
      # only the check_jvm_probes.sh diff loop above).
      - name: JVM differential suite - probes (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh test/translation-probes/"

      # Checkpoint 2: the full example corpus on the JVM backend, zero
      # failures. --exclude skips the map-iteration-order-sensitive examples
      # (tools/jvm_excluded_examples.txt); the native path below still runs
      # every example, unchanged.
      - name: JVM differential suite - examples (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_jvm.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # Permutation guard for the exclusion list itself. check_examples.py
      # SKIPs an excluded name; it never runs it, so it cannot tell a real
      # permutation from a content bug. This step runs diff_runtimes.py over
      # exactly the names in tools/jvm_excluded_examples.txt (read from the
      # file, so a new entry is covered with no CI edit) and fails the gate
      # if any one of them stops being a permutation of native stdout.
      - name: JVM differential suite - excluded examples stay permutations (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh --exclude tools/jvm_excluded_examples.txt --only-excluded examples/"

      # Full-corpus differential, every example. check_examples.py only
      # checks each example's own CHECK directives, so an example with none
      # (examples/bench_jump_table.lox, examples/remove.lox) could print a
      # wrong answer with CI green. This step compares full stdout for every
      # example instead.
      - name: JVM differential suite - full example corpus (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_jvm.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # Checkpoint 3: the self-hosted interpreter compiles, assembles, and
      # runs on the JVM backend, and interprets a Lox++ program correctly.
      # An emptiness guard catches the case where both wrappers fail silently
      # with empty stdout, which a bare `diff <(a) <(b)` would report as a
      # match.
      - name: JVM differential suite - self-hosted interpreter on the JVM backend (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              native_out=$(bootstrap/lox_wrapper.sh examples/fibonacci.lox)
              jvm_out=$(tools/loxpp_jvm_bootstrap.sh examples/fibonacci.lox)
              if [ -z "$native_out" ] || [ -z "$jvm_out" ]; then
                echo "one or both wrappers gave empty stdout; a silent failure would look like a match"
                exit 1
              fi
              diff <(printf "%s\n" "$native_out") <(printf "%s\n" "$jvm_out")
            '

      # Checkpoint 4: every example, run through the self-hosted
      # interpreter, with the interpreter itself running on the JVM backend.
      # Zero failures, same exclusion list as checkpoint 2.
      - name: JVM differential suite - examples through the self-hosted interpreter on the JVM backend (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_jvm_bootstrap.sh examples/ --exclude tools/jvm_excluded_examples.txt"

      # CLR twin of checkpoint 1: byte-identical on native and CLR stdout
      # (differential runner, not only the check_clr_probes.sh diff loop
      # above). Zero exclusions. Reads both test/translation-probes/ and
      # its clr-only/ subdirectory — Path.glob("*.lox") does not recurse
      # into subdirectories on its own, and the CLR-specific probes
      # (deep-recursion frame ceiling, multi-slot fold repair) live there
      # precisely because the JVM twin of this step must not run them.
      - name: CLR differential suite - probes (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_clr.sh test/translation-probes/ test/translation-probes/clr-only/"

      # CLR twin of checkpoint 2: the full example corpus on the CLR backend,
      # zero failures. --exclude skips the map-iteration-order-sensitive
      # examples (tools/clr_excluded_examples.txt); the native path below
      # still runs every example, unchanged.
      - name: CLR differential suite - examples (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_clr.sh examples/ --exclude tools/clr_excluded_examples.txt"

      # Permutation guard for the CLR exclusion list itself. check_examples.py
      # SKIPs an excluded name; it never runs it, so it cannot tell a real
      # permutation from a content bug. This step runs diff_runtimes.py over
      # exactly the names in tools/clr_excluded_examples.txt (read from the
      # file, so a new entry is covered with no CI edit) and fails the gate
      # if any one of them stops being a permutation of native stdout.
      - name: CLR differential suite - excluded examples stay permutations (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_clr.sh --exclude tools/clr_excluded_examples.txt --only-excluded examples/"

      # Full-corpus differential, every example. check_examples.py only
      # checks each example's own CHECK directives, so an example with none
      # (examples/bench_jump_table.lox, examples/remove.lox) could print a
      # wrong answer with CI green. This step compares full stdout for every
      # example instead.
      - name: CLR differential suite - full example corpus (N11)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/diff_runtimes.py build/loxpp tools/loxpp_clr.sh examples/ --exclude tools/clr_excluded_examples.txt"

      # Checkpoint 2 (C-N12): the self-hosted interpreter compiles,
      # assembles, and runs on the CLR backend, and interprets a Lox++
      # program correctly. The CLR twin of the matching JVM step above. An
      # emptiness guard catches the case where both wrappers fail silently
      # with empty stdout, which a bare `diff <(a) <(b)` would report as a
      # match.
      - name: CLR differential suite - self-hosted interpreter on the CLR backend (C-N12)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              native_out=$(bootstrap/lox_wrapper.sh examples/fibonacci.lox)
              clr_out=$(tools/loxpp_clr_bootstrap.sh examples/fibonacci.lox)
              if [ -z "$native_out" ] || [ -z "$clr_out" ]; then
                echo "one or both wrappers gave empty stdout; a silent failure would look like a match"
                exit 1
              fi
              diff <(printf "%s\n" "$native_out") <(printf "%s\n" "$clr_out")
            '

      # Checkpoint 3 (C-N12): every example, run through the self-hosted
      # interpreter, with the interpreter itself running on the CLR
      # backend. Zero failures, same exclusion list as the direct CLR path.
      - name: CLR differential suite - examples through the self-hosted interpreter on the CLR backend (C-N12)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c "python3 tools/check_examples.py tools/loxpp_clr_bootstrap.sh examples/ --exclude tools/clr_excluded_examples.txt"

      # Closes, for the CLR path, a known limit the JVM gate above still
      # carries: check_examples.py only checks each bootstrapped example's
      # own CHECK directives, not its full stdout, so an example with none
      # could print a wrong answer through the interpreter with this gate
      # green. This step compares full stdout instead, native's own
      # bootstrap wrapper as the oracle, for every example except
      # examples/bench_jump_table.lox: a 5,000,000-iteration microbenchmark
      # with no CHECK directives, and interpreting it twice over (native
      # once for the oracle, CLR once for the comparison) does not finish
      # inside this step's own timeout on either side — measured, not a CLR
      # defect, so it is left out of the file list by name rather than
      # routed through tools/clr_excluded_examples.txt, which excuses only
      # a map-order permutation, never a timeout.
      - name: CLR differential suite - full example corpus through the self-hosted interpreter (C-N12)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LANGUAGE=LOXPP \
            loxpp-dev-managed:latest \
            bash -c '
              files=$(find examples -maxdepth 1 -name "*.lox" ! -name "bench_jump_table.lox" | sort)
              python3 tools/diff_runtimes.py bootstrap/lox_wrapper.sh tools/loxpp_clr_bootstrap.sh $files --exclude tools/clr_excluded_examples.txt --timeout 60
            '
